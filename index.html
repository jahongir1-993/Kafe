      html += `<div class="card between"><div><b>${esc(kl[x.kind] || x.kind || '')}${x.bucket === 'term' ? ' · Terminal' : ''}${x.note && x.kind !== 'close' && x.kind !== 'open' ? ' · ' + esc(x.note) : ''}</b><div class="mute">${tm}${x.by ? ' · ' + esc(x.by) : ''}</div></div><div class="between" style="gap:10px"><b class="${x.type === 'in' ? 'pos' : ''}">${x.type === 'in' ? '+' : '−'}${money(x.amount)}</b>${S.me.role === 'admin' ? `<button class="btn sm ghost" data-a="del" data-c="safe" data-id="${x.id}" aria-label="O'chirish">✕</button>` : ''}</div></div>`;
    });
    H('sl', html || '<div class="empty">Yozuv yo\'q.</div>');
  }
  if (t === 'xod') H('xl2', S.users.map(u => row(`<div><b>${esc(u.name)}</b><div class="mute">${esc(u.login)} · ${esc(u.role)}</div></div>`, u.id === S.me.id ? '' : del('users', u.id))).join(''));
  if (t === 'hisob') {
    const rev = S.sales.reduce((s, x) => s + x.total, 0), cogs = S.sales.reduce((s, x) => s + x.items.reduce((a, i) => a + i.cost * i.qty, 0), 0), exp = S.expenses.reduce((s, x) => s + x.amount, 0), wg = S.wages.reduce((s, x) => s + x.amount, 0), totalDebt = S.debtSales.reduce((s, x) => s + x.total, 0) - S.debtPays.reduce((s, x) => s + x.amount, 0), by = k => S.sales.filter(x => x.pay === k).reduce((s, x) => s + x.total, 0), pr = rev - cogs - exp - wg, top = {};
    const rpBy = k => S.dpDay.filter(x => (x.pay || x.method || 'naqd') === k).reduce((s, x) => s + x.amount, 0);

    const dl = S.contacts.map(c => [c, debtOf(c.id)]).filter(e => e[1] > 0).map(e => `<div class="between"><span>${esc(e[0].name)} <small class="mute">${esc(e[0].phone)}</small></span><b class="neg">${money(e[1])}</b></div>`).join('') || '<div class="mute">Qarz yo\'q.</div>';
    const sl = S.sales.slice(0, 100).map(x => `<div class="between" style="margin-top:6px"><span>${dtf(x.ts)} · ${esc(x.where || 'Saboy')} · ${esc(x.pay)}${x.contactName ? ' (' + esc(x.contactName) + ')' : ''}</span><b>${money(x.total)}</b></div>`).join('') || '<div class="mute">Savdo yo\'q.</div>';
    const fromMs = new Date(S.day + 'T00:00:00').getTime(), toMs = new Date(S.day2 + 'T00:00:00').getTime() + 864e5, msOf = x => x.ts && x.ts.toMillis ? x.ts.toMillis() : 0;
    const sk = x => (x.pay || 'naqd') === 'naqd' ? (x.source === 'seyf' ? 'seyf' : 'kassa') : x.pay, sumBy = (arr, k) => arr.filter(x => sk(x) === k).reduce((s, x) => s + x.amount, 0);
    const srcLine = arr => [['kassa', 'Kassadan'], ['seyf', 'Seyfdan'], ['karta', 'Karta'], ['terminal', 'Terminal']].map(e => [e[1], sumBy(arr, e[0])]).filter(e => e[1]).map(e => `<div class="between" style="font-size:14px"><span class="mute">— ${e[0]}</span><span>${money(e[1])}</span></div>`).join('');
    const oK = sumBy(S.expenses, 'kassa') + sumBy(S.wages, 'kassa'), oS = sumBy(S.expenses, 'seyf') + sumBy(S.wages, 'seyf'), oC = ['karta', 'terminal'].reduce((s, k) => s + sumBy(S.expenses, k) + sumBy(S.wages, k), 0);
    const sf = S.safeAll || [], sg = x => x.type === 'in' ? x.amount : -x.amount, tot = a => a.reduce((s, x) => s + x.amount, 0);
    const sfCard = (title, bk) => {
      const Lb = sf.filter(x => (x.bucket || 'main') === bk), inR = Lb.filter(x => msOf(x) >= fromMs && msOf(x) < toMs), before = Lb.filter(x => msOf(x) < fromMs).reduce((s, x) => s + sg(x), 0);
      const I = k => tot(inR.filter(x => x.type === 'in' && x.kind === k)), O = k => tot(inR.filter(x => x.type === 'out' && x.kind === k)), inAll = tot(inR.filter(x => x.type === 'in')), outAll = tot(inR.filter(x => x.type === 'out'));

      const row = (l, v, sign, cls) => v ? `<div class="between"><span>${l}</span><b class="${cls}">${sign}${money(v)}</b></div>` : '';
      return `<div class="card"><b>${title}</b><div class="between" style="margin-top:6px"><span>Davr boshida</span><b>${money(before)}</b></div>${row('Kassalar yopilganda kirgan', I('close'), '+', 'pos')}${row('Qarz qaytdi / boshqa kirim', inAll - I('close'), '+', 'pos')}${row('Xarajat / oylik', O('xarajat') + O('oylik'), '−', '')}${row('Boshqa chiqim', outAll - O('xarajat') - O('oylik'), '−', '')}<hr style="border:0;border-top:1px solid var(--line);margin:10px 0"><div class="between"><span>Davr oxirida</span><b>${money(end)}</b></div><div class="between"><span>Hozirgi qoldiq</span><b>${money(now)}</b></div>${closes.length ? '<div class="mute" style="margin-top:8px">Kassa yopilishlari:</div>' + closes.map(x => `<div class="between"><span>${dtf(x.ts)}</span><b>${money(sg(x))}</b></div>`).join('') : ''}</div>`;
    };
    H('rb', `<div class="card"><div class="mute">Jami savdo</div><div class="big">${money(rev)}</div><div class="mute" style="margin:4px 0 10px">${S.sales.filter(x => !x.part).length} ta savdo</div>${['naqd', 'karta', 'terminal'].map(k => `<div class="between"><span>${k[0].toUpperCase() + k.slice(1)}</span><b>${money(by(k) + rpBy(k))}</b></div>${rpBy(k) ? `<div class="mute" style="margin:-2px 0 6px;text-align:right;font-size:13px">shundan qarz qaytgan: ${money(rpBy(k))}</div>` : ''}`).join('')}<div class="between" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Jami tushgan pul</span><b>${money(['naqd', 'karta', 'terminal'].reduce((s, k) => s + by(k) + rpBy(k), 0))}</b></div><div class="between" style="margin-top:8px"><span>Qarz (to'lanmagan)</span><b class="${totalDebt > 0 ? 'neg' : ''}">${money(totalDebt)}</b></div>${by('qarz') ? `<div class="mute" style="text-align:right;font-size:13px">qarzga berilgan: ${money(by('qarz'))}</div>` : ''}</div><div class="card"><b>Chiqimlar</b><div class="between" style="margin-top:6px"><span>Xarajat</span><b>${money(exp)}</b></div>${srcLine(S.expenses)}<div class="between" style="margin-top:6px"><span>Oylik</span><b>${money(wg)}</b></div>${srcLine(S.wages)}<div class="between" style="margin-top:6px"><span>Tannarx</span><b>${money(cogs)}</b></div><hr style="border:0;border-top:1px solid var(--line);margin:10px 0"><div class="between"><span>Jami chiqim</span><b>${money(exp + wg + cogs)}</b></div></div><div class="card"><b>Xarajat va oylik qayerdan berilgan</b><div class="between" style="margin-top:6px"><span>Kassadan</span><b>${money(oK)}</b></div><div class="between"><span>Seyfdan</span><b>${money(oS)}</b></div><div class="between"><span>Karta / Terminal</span><b>${money(oC)}</b></div><hr style="border:0;border-top:1px solid var(--line);margin:10px 0"><div class="between"><span>Jami</span><b>${money(exp + wg)}</b></div></div><div class="card"><div class="mute">Sof foyda</div><div class="big ${pr >= 0 ? 'pos' : 'neg'}">${money(pr)}</div><div class="mute" style="margin-top:4px">Savdo ${money(rev)} − tannarx ${money(cogs)} − xarajat ${money(exp)} − oylik ${money(wg)}</div></div>${sfCard('Seyf · Naqd + Karta', 'main')}${sfCard('Seyf · Terminal', 'term')}${S.me.role === 'boss' ? `<div class="card"><b>Nimalar sotilgan</b>${(() => { const ag = {}; S.sales.forEach(x => (x.items || []).forEach(i => { const e = ag[i.name] || (ag[i.name] = { q: 0, s: 0 }); e.q += i.qty; e.s += i.qty * (i.price || 0); })); const ns = Object.keys(ag).sort((x, y) => ag[y].q - ag[x].q); return ns.map(n => `<div class="between" style="margin-top:6px"><span>${esc(n)} × ${ag[n].q}</span><b>${money(ag[n].s)}</b></div>`).join('') || '<div class="mute">Savdo yo\'q.</div>'; })()}</div>` : `<div class="card"><b>Ko'p sotilgan</b>${Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => `<div class="between"><span>${esc(x[0])}</span><b>${x[1]} ta</b></div>`).join('') || '<div class="mute">Savdo yo\'q.</div>'}</div>`}<div class="card"><b>Stol / Saboy bo'yicha</b>${grp(x => x.where || 'Saboy')}</div><div class="card"><b>Ofitsantlar bo'yicha</b>${grp(x => x.waiter)}</div><div class="card"><div class="between"><b>Qarzdorlar</b><b class="neg">${money(totalDebt)}</b></div>${dl}</div><div class="card"><b>Savdolar</b>${sl}</div><h2>Chiqim va to'lovlar</h2>${logs(false)}<div class="card between"><span>Kassa</span><b>${S.shiftList[0] ? 'Ochiq (boshida ' + money(S.shiftList[0].cash) + ')' : 'Yopiq'}</b></div>${S.me.role === 'boss' ? '' : `<div class="card"><b>Qoldiq</b>${S.products.map(p => `<div class="between"><span>${esc(p.name)}</span><b class="${(p.stock || 0) <= 5 ? 'low' : ''}">${p.stock || 0}</b></div>`).join('') || '<div class="mute">Tovar yo\'q.</div>'}</div>`}`);
