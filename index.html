      const pay = cash && it.length && !gone ? `<div class="card"><div class="seg">${['naqd', 'karta', 'terminal', 'qarz', 'aralash'].map(x => `<button data-a="pay" data-id="${x}" style="font-size:14px;padding:10px 2px" class="${(x === 'aralash' ? S.mix : S.pm.includes(x)) ? 'on' : ''}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>${S.pm.length > 1 ? S.pm.map((m, i) => `<div class="between" style="margin-top:8px"><span>${m[0].toUpperCase() + m.slice(1)}${i === S.pm.length - 1 ? ' <small class="mute">(qolgani)</small>' : ''}</span><input class="qi" style="width:150px" type="number" inputmode="numeric" data-pm="${m}" value="${pa.list[i][1]}"></div>`).join('') + (pa.over ? '<div class="neg" style="margin-top:6px">Summa jamidan oshib ketdi</div>' : '') + (S.mix ? '<div class="mute" style="margin-top:6px">' + (S.pm.length > 1 ? "Bittasiga summa yozing, qolgani oxirgi tanlangan usulga o'zi yoziladi." : "Kerakli boshqa usulni ham bosing (masalan Karta).") + '</div>' : '') : ''}${S.pm.includes('qarz') && (S.pm.length === 1 || (pa.list.find(e => e[0] === 'qarz') || [0, 0])[1] > 0) ? `<button class="btn" data-a="cpick" style="margin-top:8px;background:var(--card);color:var(--ink);border:1px solid var(--line)">${S.contact ? 'Kontakt: ' + esc((S.contacts.find(c => c.id === S.contact) || {}).name || '') + ' ▸' : 'Kontaktni tanlang ▸'}</button>` : ''}<div class="between"><span>Jami</span><span class="big">${money(total)}</span></div></div>` : '';
      const bar = oo && !it.length ? '<button class="btn bad" data-a="cancelorder">Zakazni bekor qilish</button>' : cash ? `<div class="row"><button class="btn" data-a="send" style="background:var(--card);color:var(--ink);border:1px solid var(--line)" ${ok}>${oo ? 'Saqlash' : 'Yuborish'}</button><button class="btn" data-a="sell" ${ok || (pa.over ? 'disabled' : '')}>Sotish · ${money(total)}</button></div>` : `<button class="btn" data-a="send" ${ok}>${oo ? 'Saqlash' : 'Yuborish'} · ${money(total)}</button>`;
      H('zv', `<div class="between" style="margin-bottom:10px"><button class="btn sm ghost" data-a="wback" style="color:var(--ink)">← Orqaga</button><b style="font-size:18px">${esc(title)}</b><span class="mute">${oo ? esc(oo.waiter) : 'Yangi zakaz'}</span></div>`
        + (gone ? '<div class="card neg"><b>Bu zakaz yopilgan yoki bekor qilingan.</b> Orqaga qayting.</div>' : '')
        + `<div class="card">${it.length ? it.map(i => `<div class="between" style="margin-bottom:8px"><div><b>${esc(i.name)}</b><div class="mute">${money(i.price * i.qty)}</div></div><div class="qty"><button data-a="minus" data-id="${i.id}" aria-label="Kamaytirish">−</button><input class="qi" type="number" inputmode="numeric" value="${i.qty}" data-q="${i.id}"><button data-a="plus" data-id="${i.id}" aria-label="Ko'paytirish">+</button></div></div>`).join('') : '<div class="empty">Hali ovqat yo\'q. Pastdan tanlang.</div>'}${oo && it.length ? '<button class="btn ghost" data-a="cancelorder" style="margin-top:4px">Zakazni bekor qilish</button>' : ''}</div>`
        + pay
        + (S.cats.length ? `<div class="chips"><button data-a="cat" data-id="" class="${!S.cat ? 'on' : ''}">Hammasi</button>` + S.cats.map(c => `<button data-a="cat" data-id="${c.id}" class="${S.cat === c.id ? 'on' : ''}">${esc(c.name)}</button>`).join('') + '</div>' : '')
        + `<div class="grid">${ps.length ? ps.map(p => { const q = S.cart[p.id] || 0; return `<button class="item ${q ? 'in' : ''}" data-a="add" data-id="${p.id}">${p.img ? `<img src="${p.img}" alt="">` : ''}<b>${esc(p.name)}</b>${money(p.price)}${cash ? `<br><small class="${(p.stock || 0) <= 0 ? 'low' : ''}">Qoldiq: ${p.stock || 0}${q ? ' · zakazda ' + q : ''}</small>` : q ? `<br><small>zakazda: ${q}</small>` : ''}</button>`; }).join('') : '<div class="empty" style="grid-column:1/-1">Tovar yo\'q.</div>'}</div>`
        + `<div class="bar">${bar}</div>`);
      document.querySelectorAll('[data-q]').forEach(i => i.onchange = () => { const v = Math.floor(+i.value); S.dirty = true; if (v > 0) S.cart[i.dataset.q] = v; else delete S.cart[i.dataset.q]; fill(); });
      document.querySelectorAll('[data-pm]').forEach(i => i.onchange = () => { setAmt(i.dataset.pm, Math.max(0, Math.round(+i.value || 0))); fill(); });
    }
  }
  if (t === 'tarix') {
    const h = S.hist, hm = ts => ts && ts.toDate ? ts.toDate().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '', cap = x => x ? x[0].toUpperCase() + x.slice(1) : '', line = l => (l || []).map(i => esc(i.name) + ' × ' + i.qty).join(', ');
    if (!h) H('tr', '<div class="empty">Yuklanmoqda...</div>');
    else if (h.err) H('tr', `<div class="card neg">Xato: ${esc(h.err)}</div>`);
    else {
      const gm = {}; h.sales.forEach(x => { const k = x.group || x.id, g = gm[k] || (gm[k] = { ...x, total: 0, pays: [], items: [] }); g.total += x.total; g.pays.push(x); if (x.items && x.items.length) g.items = x.items; }); const groups = Object.values(gm), tot = h.sales.reduce((s, x) => s + x.total, 0), by = {}, agg = {};
      h.sales.forEach(x => { by[x.pay] = (by[x.pay] || 0) + x.total; (x.items || []).forEach(i => { const a = agg[i.name] || (agg[i.name] = { q: 0, s: 0 }); a.q += i.qty; a.s += i.qty * i.price; }); });
      const names = Object.keys(agg).sort((x, y) => agg[y].q - agg[x].q);
      H('tr', h.sales.length || h.canc.length ? `<div class="card"><div class="between"><span>Jami savdo</span><b class="big">${money(tot)}</b></div><div class="mute" style="margin-top:6px">${groups.length} ta savdo</div>${Object.keys(by).map(k => `<div class="between" style="margin-top:6px"><span>${cap(k)}</span><b>${money(by[k])}</b></div>`).join('')}</div>`
        + (names.length ? '<h2>Nimalar sotilgan</h2><div class="card">' + names.map(n => `<div class="between" style="margin-bottom:6px"><span>${esc(n)} × ${agg[n].q}</span><b>${money(agg[n].s)}</b></div>`).join('') + '</div>' : '')
        + (groups.length ? '<h2>Savdolar</h2>' + groups.map(x => `<div class="card"><div class="between"><b>${esc(x.where || '')}</b><span class="mute">${hm(x.ts)}</span></div><div class="mute" style="margin:6px 0">${line(x.items)}</div><div style="margin-bottom:6px">${x.pays.map(p => cap(p.pay) + ' ' + money(p.total) + (p.contactName ? ' (' + esc(p.contactName) + ')' : '')).join(' + ')}</div><div class="between"><b>${money(x.total)}</b><span class="mute">${x.waiter ? 'Ofitsant: ' + esc(x.waiter) + ' · ' : ''}Kassir: ${esc(x.cashier || '')}</span></div></div>`).join('') : '')
        + (h.canc.length ? '<h2>Bekor qilingan zakazlar</h2>' + h.canc.map(o => `<div class="card"><div class="between"><b>${esc(tl(o.table))}</b><span class="mute">${hm(o.ts)} · ${esc(o.waiter || '')}</span></div><div class="mute" style="margin:6px 0">${line(o.items)}</div><b class="neg">${money(o.total)}</b></div>`).join('') : '')
        : '<div class="empty">Bu kunda savdo yo\'q.</div>');
    }
  }
  if (t === 'tov') {
    const o = '<option value="">Kategoriyasiz</option>' + S.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join(''), pc = g('pc'), pv = pc.value; pc.innerHTML = o; pc.value = pv;
    const ks = g('ks'), kv = ks.value; ks.innerHTML = S.products.map(p => `<option value="${p.id}">${esc(p.name)} (${p.stock || 0})</option>`).join(''); ks.value = kv;
    H('cl', S.cats.map(c => `<span class="between" style="margin-bottom:6px">${esc(c.name)}${del('cats', c.id)}</span>`).join('') || '<span class="mute">Kategoriya yo\'q.</span>');
    H('pl', S.products.map(p => `<div class="card"><div class="between"><div class="row" style="flex:none">${p.img ? `<img class="th" src="${p.img}" alt="">` : ''}<div><b>${esc(p.name)}</b><div class="mute">${money(p.price)} · tannarx ${money(p.cost)}</div></div></div><div class="${(p.stock || 0) <= 5 ? 'low' : ''}">${p.stock || 0} ta</div></div><div class="row" style="margin-top:8px"><button class="btn sm" data-a="edit" data-id="${p.id}">Tahrirlash</button>${del('products', p.id)}</div></div>`).join('') || '<div class="empty">Tovar yo\'q.</div>');
  }
  if (t === 'kon') H('kl', S.contacts.map(c => `<div class="card"><div class="between"><div><b>${esc(c.name)}</b><div class="mute">${esc(c.phone)} · ${c.type}</div></div>${del('contacts', c.id)}</div><div class="between" style="margin-top:6px"><span>Qarz</span><b class="${debtOf(c.id) > 0 ? 'neg' : ''}">${money(debtOf(c.id))}</b></div></div>`).join('') || '<div class="empty">Kontakt yo\'q.</div>');
  if (t === 'esl') H('nl', S.notes.slice().sort((a, b) => (a.done - b.done) || String(a.date || '9').localeCompare(String(b.date || '9'))).map(n => row(`<div><b style="${n.done ? 'text-decoration:line-through;opacity:.5' : ''}">${esc(n.text)}</b>${n.date ? `<div class="mute">${esc(n.date)}</div>` : ''}</div>`, `<div class="row" style="flex:none"><button class="btn sm ${n.done ? 'ghost' : ''}" data-a="done" data-id="${n.id}" data-v="${n.done ? 1 : 0}">${n.done ? 'Qaytarish' : 'Bajarildi'}</button>${del('notes', n.id)}</div>`)).join('') || '<div class="empty">Eslatma yo\'q.</div>');
  if (t === 'stol') H('tl', S.tables.map(x => row(`<b>${esc(x.name)}${S.orders.some(o => o.table === x.name) ? ' ●' : ''}</b>`, `<div class="row" style="flex:none"><button class="btn sm" data-a="tedit" data-id="${x.id}">Tahrirlash</button>${del('tables', x.id)}</div>`)).join('') || '<div class="empty">Stol yo\'q.</div>');
  if (t === 'xar') {
    const cash = S.me.role === 'kassir', xm = S.xm, tt = { xarajat: 'Kimga berildi (ixtiyoriy)', oylik: 'Qaysi xodimga oylik', qarz: 'Qarzdor kim pul berdi' }[xm];
    const cl = S.contacts.filter(c => xm !== 'oylik' || c.type === 'ishchi');
    H('xf', `<div class="seg">${[['xarajat', 'Xarajat'], ['oylik', 'Oylik'], ['qarz', 'Qarz qaytdi']].map(x => `<button data-a="xm" data-id="${x[0]}" class="${xm === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}</div><div class="mute" style="margin:10px 0 6px">${tt}</div><div class="row"><button class="btn" data-a="xpick" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">${S.xc ? esc((S.contacts.find(c => c.id === S.xc) || {}).name || '') + ' ▸' : 'Kontaktni tanlang ▸'}</button>${S.xc && xm === 'xarajat' ? '<button class="btn sm ghost" data-a="xcc" style="flex:none">✕</button>' : ''}</div><div class="mute" style="margin:10px 0 6px">${xm === 'qarz' ? 'Qaysi usulda oldingiz' : 'Qaysi usulda berdingiz'}</div><div class="seg">${(xm === 'qarz' ? ['naqd', 'karta', 'terminal'] : ['naqd', 'karta']).map(k => `<button data-a="xp" data-id="${k}" class="${S.xp === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div><details style="margin:8px 0"><summary class="mute">+ Yangi kontakt</summary><input id="xcn" placeholder="Ismi" style="margin-top:8px"><input id="xcp" type="tel" placeholder="Telefon raqami"><select id="xct"><option value="mijoz">Mijoz</option><option value="ishchi"${xm === 'oylik' ? ' selected' : ''}>Ishchi</option></select><button class="btn sm" data-a="xcadd">Kontaktni saqlash</button></details>`);
    $('#en').placeholder = xm === 'xarajat' ? 'Nima uchun' : 'Izoh (ixtiyoriy)';
    H('el', logs(S.me.role === 'admin'));
  }
  if (t === 'xod') H('xl2', S.users.map(u => row(`<div><b>${esc(u.name)}</b><div class="mute">${esc(u.login)} · ${esc(u.role)}</div></div>`, u.id === S.me.id ? '' : del('users', u.id))).join(''));
  if (t === 'hisob') {
    const rev = S.sales.reduce((s, x) => s + x.total, 0), cogs = S.sales.reduce((s, x) => s + x.items.reduce((a, i) => a + i.cost * i.qty, 0), 0), exp = S.expenses.reduce((s, x) => s + x.amount, 0), wg = S.wages.reduce((s, x) => s + x.amount, 0), totalDebt = S.debtSales.reduce((s, x) => s + x.total, 0) - S.debtPays.reduce((s, x) => s + x.amount, 0), by = k => S.sales.filter(x => x.pay === k).reduce((s, x) => s + x.total, 0), pr = rev - cogs - exp - wg, top = {};
    S.sales.forEach(x => x.items.forEach(i => top[i.name] = (top[i.name] || 0) + i.qty));
    const grp = f => { const m = {}; S.sales.forEach(x => { const k = f(x); if (k) m[k] = (m[k] || 0) + x.total; }); return Object.entries(m).sort((a, b) => b[1] - a[1]).map(e => `<div class="between"><span>${esc(e[0])}</span><b>${money(e[1])}</b></div>`).join('') || '<div class="mute">Yo\'q.</div>'; };
    const dl = S.contacts.map(c => [c, debtOf(c.id)]).filter(e => e[1] > 0).map(e => `<div class="between"><span>${esc(e[0].name)} <small class="mute">${esc(e[0].phone)}</small></span><b class="neg">${money(e[1])}</b></div>`).join('') || '<div class="mute">Qarz yo\'q.</div>';
    const sl = S.sales.slice(0, 30).map(x => `<div class="between" style="margin-top:6px"><span>${x.ts.toDate().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })} · ${esc(x.where || 'Soboy')} · ${esc(x.pay)}${x.contactName ? ' (' + esc(x.contactName) + ')' : ''}</span><b>${money(x.total)}</b></div>`).join('') || '<div class="mute">Savdo yo\'q.</div>';
    H('rb', `<div class="card"><div class="mute">Sof foyda</div><div class="big ${pr >= 0 ? 'pos' : 'neg'}">${money(pr)}</div></div><div class="card"><div class="between"><span>Tushum (${S.sales.filter(x => !x.part).length} ta)</span><b>${money(rev)}</b></div>${['naqd','karta','terminal','qarz'].map(k => `<div class="between mute"><span>${k[0].toUpperCase() + k.slice(1)}</span><span>${money(by(k))}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line);margin:10px 0"><div class="between"><span>Tannarx</span><b>${money(cogs)}</b></div><div class="between"><span>Xarajat</span><b>${money(exp)}</b></div><div class="between"><span>Oylik</span><b>${money(wg)}</b></div><div class="between"><span>Jami qarz (to'lanmagan)</span><b class="neg">${money(totalDebt)}</b></div></div><div class="card"><b>Ko'p sotilgan</b>${Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => `<div class="between"><span>${esc(x[0])}</span><b>${x[1]} ta</b></div>`).join('') || '<div class="mute">Savdo yo\'q.</div>'}</div><div class="card"><b>Stol / Soboy bo'yicha</b>${grp(x => x.where || 'Soboy')}</div><div class="card"><b>Ofitsantlar bo'yicha</b>${grp(x => x.waiter)}</div><div class="card"><b>Qarzdorlar</b>${dl}</div><div class="card"><b>Savdolar</b>${sl}</div><h2>Chiqim va to'lovlar</h2>${logs(false)}<div class="card between"><span>Kassa</span><b>${S.shiftList[0] ? 'Ochiq (boshida ' + money(S.shiftList[0].cash) + ')' : 'Yopiq'}</b></div><div class="card"><b>Qoldiq</b>${S.products.map(p => `<div class="between"><span>${esc(p.name)}</span><b class="${(p.stock || 0) <= 5 ? 'low' : ''}">${p.stock || 0}</b></div>`).join('') || '<div class="mute">Tovar yo\'q.</div>'}</div>`);
  }
}
loginScreen();
