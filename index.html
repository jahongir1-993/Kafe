<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caffee POS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16211d;--mute:#6b7a74;--line:#dfe5e2;--acc:#0f7a5c;--accink:#fff;--bad:#c4412f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#18211e;--ink:#e8efec;--mute:#92a29b;--line:#2a3733;--acc:#2fb88f;--accink:#04140e;--bad:#ef7967;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
main{flex:1;overflow:auto;padding:12px 12px 24px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 4px;font:inherit;font-size:14px;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
h2{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 8px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{border:0;border-radius:8px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;padding:12px;width:100%}
.btn.sm{width:auto;padding:8px 12px;flex:none}
.btn.ghost{background:none;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font:inherit;color:var(--ink)}
.item b{display:block}
.item small{color:var(--mute)}
.item:disabled{opacity:.45}
.item.in{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mute{color:var(--mute);font-size:14px}
.big{font-size:26px;font-weight:800}
.pos{color:var(--acc)}.neg{color:var(--bad)}
.low{color:var(--bad);font-weight:700}
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:18px}
.empty{text-align:center;color:var(--mute);padding:18px 8px}
.msg{padding:24px;text-align:center}
@media(prefers-reduced-motion:no-preference){.btn:active,.item:active{transform:scale(.98)}}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.chips button{flex:none;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}.item img,.th{width:100%;height:70px;object-fit:cover;border-radius:6px;margin-bottom:6px;background:var(--bg)}.th{width:48px;height:48px;margin:0}.qi{width:64px;margin:0;padding:6px;text-align:center}.login{max-width:340px;margin:auto;padding:24px 12px}nav{overflow-x:auto}nav button{flex:1 0 auto;padding:12px;white-space:nowrap}</style>
</head>
<body>
<main id="view"></main>
<nav id="nav"></nav>
<script>
const FIREBASE_CONFIG = { apiKey:"AIzaSyCkdVVeE9og--yoLMRoBWWw7dAgcNaVqKY", authDomain:"kafe-pos-94dfb.firebaseapp.com", projectId:"kafe-pos-94dfb", appId:"1:780619577621:web:30beb98f9a7eaaa997d11c" };
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const $ = s => document.querySelector(s), view = $('#view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const ask = (m, cb) => tg && tg.showConfirm ? tg.showConfirm(m, ok => ok && cb()) : (confirm(m) && cb());
const note = m => tg && tg.showAlert ? tg.showAlert(m) : alert(m);
const val = id => $('#' + id).value.trim();
const mail = l => l.toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@kafe.app';
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore(), auth = firebase.auth(), FV = firebase.firestore.FieldValue, TS = firebase.firestore.Timestamp;
db.settings({ experimentalForceLongPolling: true, merge: true });
const withTimeout = (pr, ms, label) => Promise.race([pr, new Promise((_, rj) => setTimeout(() => rj(new Error(label + ' javob bermadi (internetni tekshiring)')), ms))]);
const S = { contacts: [], notes: [], debtSales: [], debtPays: [], wages: [], shiftList: [], contact: '', me: null, products: [], cats: [], tables: [], orders: [], sales: [], expenses: [], users: [], cart: {}, table: null, orderId: null, pay: 'naqd', cat: '', day: today(), tab: '', edit: null, img: '' };
const TABS = { admin: [['kassa','Kassa'],['tov','Tovar'],['stol','Stol'],['kon','Kontakt'],['xar','Xarajat'],['hisob','Hisobot'],['esl','Eslatma'],['xod','Xodim']], kassir: [['kassa','Kassa']], ofitsant: [['zakaz','Zakaz']], boss: [['hisob','Statistika']] };
let unsubs = [], dayUnsubs = [];

function loginScreen(msg) {
  $('#nav').innerHTML = '';
  view.innerHTML = `<div class="login"><h2>Caffee POS <small class="mute">v7</small></h2><div class="card"><input id="lg" placeholder="Login" autocapitalize="none" autocomplete="username"><input id="pw" type="password" placeholder="Parol" autocomplete="current-password"><button class="btn" id="lgb">Kirish</button><p class="mute" id="lm">${esc(msg || '')}</p></div></div>`;
  $('#lgb').onclick = doLogin; $('#pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}
const errMsg = c => /too-many/.test(c) ? "Juda ko'p urinish bo'ldi. 15-30 daqiqa kutib, keyin bir marta urinib ko'ring." : /network/.test(c) ? "Internet yo'q yoki aloqa uzildi." : /operation-not-allowed|configuration/.test(c) ? "Firebase'da Email/Password yoqilmagan." : "Login yoki parol noto'g'ri.";
async function doLogin() {
  const l = val('lg'), p = $('#pw').value, btn = $('#lgb'), m = $('#lm');
  if (!l || !p) return m.textContent = 'Login va parolni kiriting.';
  btn.disabled = true; m.textContent = 'Tekshirilmoqda...';
  try { await withTimeout(auth.signInWithEmailAndPassword(mail(l), p), 20000, 'Kirish'); }
  catch (e) {
    btn.disabled = false;
    if (!e.code) return m.textContent = 'Xato: ' + e.message;
    if (l.toLowerCase() === 'admin' && !/network|too-many|wrong-password|operation-not-allowed|configuration/.test(e.code)) {
      m.textContent = '';
      return ask("Asosiy hisob topilmadi. Birinchi marta bo'lsa, shu login-parol bilan yaratilsinmi?", async () => {
        creating = true; btn.disabled = true; m.textContent = 'Yaratilmoqda...';
        try {
          const c = await auth.createUserWithEmailAndPassword(mail(l), p);
          const any = await db.collection('users').limit(1).get();
          if (!any.empty) { await c.user.delete(); creating = false; return loginScreen("Asosiy hisob allaqachon bor, parol noto'g'ri."); }
          await db.collection('users').doc(c.user.uid).set({ login: 'admin', name: 'Asosiy', role: 'admin' });
          creating = false; boot(auth.currentUser);
        } catch (e2) { creating = false; loginScreen(/already/.test(e2.code) ? errMsg('') : errMsg(e2.code) + ' (' + e2.code + ')'); }
      });
    }
    m.textContent = errMsg(e.code);
  }
}
let creating = false;
auth.onAuthStateChanged(u => { if (!creating) boot(u); });
async function boot(u) { try { await boot0(u); } catch (e) { loginScreen('Xato: ' + (e && e.message || e)); } }
window.addEventListener('error', e => { const m = $('#lm'); if (m) m.textContent = 'Xato: ' + e.message; });
window.addEventListener('unhandledrejection', e => { const m = $('#lm'); if (m) m.textContent = 'Xato: ' + (e.reason && e.reason.message || e.reason); });
async function boot0(u) {
  unsubs.forEach(f => f()); unsubs = []; dayUnsubs.forEach(f => f()); dayUnsubs = [];
  if (!u) { S.me = null; return loginScreen(); }
  let d; { const m = $('#lm'); if (m) m.textContent = "Ma'lumot yuklanmoqda..."; }
  try { d = await withTimeout(db.collection('users').doc(u.uid).get(), 20000, 'Baza'); } catch (e) { return loginScreen('Bazaga ulanib bo\'lmadi: ' + (e.code || e.message)); }
  if (!d.exists) { await auth.signOut(); return loginScreen("Bu hisob uchun ruxsat yo'q"); }
  S.me = { id: u.uid, ...d.data() };
  S.cart = {}; S.table = null; S.orderId = null;
  const L = (c, k, q) => unsubs.push((q || db.collection(c)).onSnapshot(s => { S[k] = s.docs.map(x => ({ id: x.id, ...x.data() })); fill(); }, e => note('Baza xatosi: ' + e.message)));
  L('products', 'products', db.collection('products').orderBy('name')); L('cats', 'cats'); L('tables', 'tables', db.collection('tables').orderBy('n'));
  L('orders', 'orders', db.collection('orders').where('status', '==', 'open'));
  L('contacts', 'contacts', db.collection('contacts').orderBy('name')); L('shifts', 'shiftList', db.collection('shifts').where('closed', '==', false));
  if (['admin','boss'].includes(S.me.role)) { L('debtpays', 'debtPays'); L('sales', 'debtSales', db.collection('sales').where('pay', '==', 'qarz')); }
  if (S.me.role === 'admin') { L('users', 'users'); L('notes', 'notes'); }
  listenDay(); showTab(TABS[S.me.role][0][0]);
}
function listenDay() {
  dayUnsubs.forEach(f => f()); dayUnsubs = [];
  if (!['admin','boss'].includes(S.me.role)) return;
  const a = new Date(S.day + 'T00:00:00'), b = new Date(a.getTime() + 864e5);
  const q = c => db.collection(c).where('ts', '>=', a).where('ts', '<', b).orderBy('ts', 'desc');
  dayUnsubs.push(q('sales').onSnapshot(s => { S.sales = s.docs.map(d => ({ id: d.id, ...d.data() })); fill(); }));
  dayUnsubs.push(q('expenses').onSnapshot(s => { S.expenses = s.docs.map(d => ({ id: d.id, ...d.data() })); fill(); }));
  dayUnsubs.push(q('wages').onSnapshot(s => { S.wages = s.docs.map(d => ({ id: d.id, ...d.data() })); fill(); }));
}
function showTab(t) {
  S.tab = t;
  $('#nav').innerHTML = TABS[S.me.role].map(x => `<button data-t="${x[0]}" class="${x[0] === t ? 'on' : ''}">${x[1]}</button>`).join('') + '<button data-t="out">Chiqish</button>';
  const sell = `<div id="oo"></div><div id="tb" class="chips"></div><div id="cc" class="chips"></div><div id="grid" class="grid"></div><div id="cart" class="card"></div>`;
  const F = {
    kassa: '<h2>Kassa</h2><div id="sh"></div>' + sell, zakaz: '<h2>Zakaz</h2>' + sell,
    tov: `<h2 id="ph">Yangi tovar</h2><div class="card"><input id="pn" placeholder="Nomi"><select id="pc"></select><div class="row"><input id="pp" type="number" inputmode="decimal" placeholder="Sotish narxi"><input id="pk" type="number" inputmode="decimal" placeholder="Tannarxi"></div><input id="ps" type="number" inputmode="decimal" placeholder="Qoldiq (soni)"><div class="row" style="margin-bottom:8px"><img id="pi" class="th" alt=""><input id="pf" type="file" accept="image/*" style="margin:0"></div><button class="btn" id="pb">Saqlash</button></div><h2>Kirim (mavjud tovarga)</h2><div class="card"><select id="ks"></select><div class="row"><input id="kq" type="number" inputmode="decimal" placeholder="Soni" style="margin:0"><button class="btn sm" id="kb">Kirim</button></div></div><h2>Kategoriyalar</h2><div class="card"><div class="row"><input id="cn" placeholder="Yangi kategoriya" style="margin:0"><button class="btn sm" id="cb">Qo'shish</button></div><div id="cl" style="margin-top:8px"></div></div><h2>Tovarlar</h2><div id="pl"></div>`,
    stol: `<h2>Stollar</h2><div class="card"><div class="row"><input id="tn" placeholder="Stol raqami yoki nomi" style="margin:0"><button class="btn sm" id="tb2">Qo'shish</button></div></div><div id="tl"></div>`,
    xar: `<h2>Xarajat</h2><div class="card"><input id="en" placeholder="Nima uchun"><input id="ea" type="number" inputmode="decimal" placeholder="Summa"><button class="btn" id="eb">Qo'shish</button></div><div id="el"></div>`,
    hisob: `<h2>Hisobot</h2><input id="rd" type="date" value="${S.day}"><div id="rb"></div>`,
    kon: `<h2>Yangi kontakt</h2><div class="card"><input id="kn" placeholder="Ismi"><input id="kp" type="tel" placeholder="Telefon raqami"><select id="kt"><option value="mijoz">Mijoz</option><option value="ishchi">Ishchi</option></select><button class="btn" id="kb2">Qo'shish</button></div><div id="kl"></div>`,
    esl: `<h2>Eslatma</h2><div class="card"><input id="nt" placeholder="Masalan: ertaga go'sht olaman"><input id="nd" type="date"><button class="btn" id="nb">Qo'shish</button></div><div id="nl"></div>`,
    xod: `<h2>Yangi xodim</h2><div class="card"><input id="xn" placeholder="Ismi"><input id="xl" placeholder="Login" autocapitalize="none"><input id="xp" placeholder="Parol (kamida 6 belgi)"><select id="xr"><option value="kassir">Kassir</option><option value="ofitsant">Ofitsant</option><option value="boss">Boss</option></select><button class="btn" id="xb">Yaratish</button></div><h2>Xodimlar</h2><div id="xl2"></div>`
  };
  view.innerHTML = F[t]; bind(t); fill();
}
$('#nav').onclick = e => { const t = e.target.dataset.t; if (t === 'out') auth.signOut(); else if (t) showTab(t); };
function bind(t) {
  const b = (id, f) => $('#' + id) && ($('#' + id).onclick = f);
  if (t === 'tov') {
    b('pb', saveProduct); b('kb', addStock); b('cb', async () => { const n = val('cn'); if (n) { await db.collection('cats').add({ name: n }); $('#cn').value = ''; } });
    $('#pf').onchange = e => resize(e.target.files[0]);
  }
  if (t === 'stol') b('tb2', async () => { const n = val('tn'); if (!n) return; await db.collection('tables').add({ name: n, n: parseFloat(n) || 0 }); $('#tn').value = ''; });
  if (t === 'xar') b('eb', async () => { const n = val('en'), a = +val('ea'); if (!n || !(a > 0)) return note('Nima uchun va summani kiriting.'); await db.collection('expenses').add({ name: n, amount: a, ts: TS.now() }); $('#en').value = ''; $('#ea').value = ''; });
  if (t === 'hisob') $('#rd').onchange = e => { S.day = e.target.value || today(); listenDay(); };
  if (t === 'xod') b('xb', addStaff);
  if (t === 'kon') b('kb2', async () => { const n = val('kn'); if (!n) return note('Ismini kiriting.'); await db.collection('contacts').add({ name: n, phone: val('kp'), type: $('#kt').value }); $('#kn').value = ''; $('#kp').value = ''; });
  if (t === 'esl') b('nb', async () => { const n = val('nt'); if (!n) return; await db.collection('notes').add({ text: n, date: $('#nd').value, done: false, ts: TS.now() }); $('#nt').value = ''; $('#nd').value = ''; });
  view.onclick = click;
}
function resize(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = 240 / Math.max(im.width, im.height, 240), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); S.img = c.toDataURL('image/jpeg', .7); $('#pi').src = S.img; }; im.src = r.result; };
  r.readAsDataURL(f);
}
async function saveProduct() {
  const d = { name: val('pn'), cat: $('#pc').value, price: +val('pp'), cost: +val('pk') || 0, stock: +val('ps') || 0 };
  if (!d.name || !(d.price > 0)) return note('Nomi va sotish narxini kiriting.');
  if (S.img) d.img = S.img;
  if (S.edit) await db.collection('products').doc(S.edit).update(d); else await db.collection('products').add(d);
  S.edit = null; S.img = ''; ['pn','pp','pk','ps'].forEach(i => $('#' + i).value = ''); $('#pi').removeAttribute('src'); $('#ph').textContent = 'Yangi tovar';
}
async function addStock() { const q = +val('kq'), id = $('#ks').value; if (id && q > 0) { await db.collection('products').doc(id).update({ stock: FV.increment(q) }); $('#kq').value = ''; } }
async function addStaff() {
  const n = val('xn'), l = val('xl'), p = val('xp'), r = $('#xr').value;
  if (!n || !l || p.length < 6) return note('Ism, login va kamida 6 belgili parol kiriting.');
  let sec; try { sec = firebase.app('sec'); } catch (e) { sec = firebase.initializeApp(FIREBASE_CONFIG, 'sec'); }
  try { const c = await sec.auth().createUserWithEmailAndPassword(mail(l), p); await db.collection('users').doc(c.user.uid).set({ login: l, name: n, role: r }); await sec.auth().signOut(); ['xn','xl','xp'].forEach(i => $('#' + i).value = ''); }
  catch (e) { note(/already/.test(e.code) ? 'Bu login band.' : 'Xato: ' + e.message); }
}
function click(e) {
  const t = e.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a, id = t.dataset.id, D = db.collection;
  if (a === 'add') { const p = S.products.find(x => x.id === id); if (S.me.role !== 'ofitsant' && (S.cart[id] || 0) >= (p.stock || 0)) return; S.cart[id] = (S.cart[id] || 0) + 1; fill(); }
  else if (a === 'minus') { if (--S.cart[id] <= 0) delete S.cart[id]; fill(); }
  else if (a === 'plus') { S.cart[id]++; fill(); }
  else if (a === 'cat') { S.cat = id; fill(); }
  else if (a === 'tbl') { S.table = id; fill(); }
  else if (a === 'pay') { S.pay = id; fill(); }
  else if (a === 'order') loadOrder(id);
  else if (a === 'send') sendOrder();
  else if (a === 'sell') sell();
  else if (a === 'edit') { const p = S.products.find(x => x.id === id); S.edit = id; S.img = ''; $('#ph').textContent = 'Tahrirlash'; $('#pn').value = p.name; $('#pc').value = p.cat || ''; $('#pp').value = p.price; $('#pk').value = p.cost || 0; $('#ps').value = p.stock || 0; if (p.img) $('#pi').src = p.img; else $('#pi').removeAttribute('src'); scrollTo(0, 0); view.scrollTop = 0; }
  else if (a === 'cont') { S.contact = id; fill(); }
  else if (a === 'done') db.collection('notes').doc(id).update({ done: t.dataset.v !== '1' });
  else if (a === 'dp' || a === 'wage') { const inp = $('#' + (a === 'dp' ? 'dp-' : 'wg-') + id), v = +inp.value, c = S.contacts.find(x => x.id === id); if (!(v > 0)) return; db.collection(a === 'dp' ? 'debtpays' : 'wages').add({ contactId: id, name: c.name, amount: v, ts: TS.now() }); inp.value = ''; }
  else if (a === 'shopen') db.collection('shifts').add({ open: TS.now(), cash: +val('sc') || 0, closed: false, by: S.me.name });
  else if (a === 'shclose') ask('Kassa yopilsinmi?', closeShift);
  else if (a === 'del') ask("O'chirilsinmi?", () => db.collection(t.dataset.c).doc(id).delete());
}
async function sendOrder() {
  const it = items(); if (!S.table || !it.length) return note('Stolni tanlang va ovqat qo\'shing.');
  const tb = S.tables.find(x => x.id === S.table);
  await db.collection('orders').add({ table: tb.name, items: it, total: it.reduce((s, i) => s + i.qty * i.price, 0), waiter: S.me.name, status: 'open', ts: TS.now() });
  S.cart = {}; S.table = null; fill(); note('Zakaz yuborildi');
}
function loadOrder(id) { const o = S.orders.find(x => x.id === id); S.cart = {}; o.items.forEach(i => S.cart[i.id] = i.qty); S.orderId = id; S.table = null; fill(); }
const items = () => Object.keys(S.cart).map(id => { const p = S.products.find(x => x.id === id); return p && { id, name: p.name, qty: S.cart[id], price: p.price, cost: p.cost || 0 }; }).filter(Boolean);
async function closeShift() {
  const sh = S.shiftList[0]; if (!sh) return;
  const q = await db.collection('sales').where('ts', '>=', sh.open).get(), by = { naqd: 0, karta: 0, terminal: 0, qarz: 0 };
  q.docs.forEach(d => { const x = d.data(); by[x.pay] = (by[x.pay] || 0) + x.total; });
  await db.collection('shifts').doc(sh.id).update({ closed: true, closedAt: TS.now(), totals: by });
  note('Kassa yopildi. Kassada bo\'lishi kerak naqd: ' + money(by.naqd + sh.cash) + ' (ochilishdagi ' + money(sh.cash) + ' bilan). Karta: ' + money(by.karta) + ', terminal: ' + money(by.terminal) + ', qarz: ' + money(by.qarz));
}
const debtOf = id => S.debtSales.filter(x => x.contactId === id).reduce((s, x) => s + x.total, 0) - S.debtPays.filter(x => x.contactId === id).reduce((s, x) => s + x.amount, 0);
async function sell() {
  const it = items(); if (!it.length) return;
  if (!S.shiftList.length) return note('Avval kassani oching.');
  if (S.pay === 'qarz' && !S.contact) return note('Qarzga sotish uchun kontaktni tanlang.');
  const o = S.orders.find(x => x.id === S.orderId), tb = S.tables.find(x => x.id === S.table);
  const b = db.batch();
  b.set(db.collection('sales').doc(), { ts: TS.now(), items: it, total: it.reduce((s, i) => s + i.qty * i.price, 0), pay: S.pay, where: o ? 'Stol ' + o.table : tb ? 'Stol ' + tb.name : 'Soboy', waiter: o ? o.waiter : '', cashier: S.me.name, contactId: S.pay === 'qarz' ? S.contact : '', contactName: S.pay === 'qarz' ? ((S.contacts.find(c => c.id === S.contact) || {}).name || '') : '' });
  it.forEach(i => b.update(db.collection('products').doc(i.id), { stock: FV.increment(-i.qty) }));
  if (o) b.update(db.collection('orders').doc(o.id), { status: 'paid' });
  try { await b.commit(); S.cart = {}; S.orderId = null; S.table = null; S.contact = ''; S.pay = 'naqd'; fill(); } catch (e) { note('Saqlanmadi: ' + e.message); }
}
function fill() {
  if (!S.me) return; const g = id => $('#' + id), t = S.tab, H = (id, h) => { const e = g(id); if (e && e._h !== h) { e._h = h; e.innerHTML = h; } };

    const it = items(), total = it.reduce((s, i) => s + i.qty * i.price, 0);
    H('cart', it.length ? it.map(i => `<div class="between" style="margin-bottom:8px"><div><b>${esc(i.name)}</b><div class="mute">${money(i.price * i.qty)}</div></div><div class="qty"><button data-a="minus" data-id="${i.id}" aria-label="Kamaytirish">−</button><input class="qi" type="number" inputmode="numeric" value="${i.qty}" data-q="${i.id}"><button data-a="plus" data-id="${i.id}" aria-label="Ko'paytirish">+</button></div></div>`).join('') + (w ? `<div class="between" style="margin:8px 0"><span>Jami</span><span class="big">${money(total)}</span></div><button class="btn" data-a="send">Zakazni yuborish</button>` : `<div class="seg">${['naqd','karta','terminal','qarz'].map(x => `<button data-a="pay" data-id="${x}" class="${S.pay === x ? 'on' : ''}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>${S.pay === 'qarz' ? '<div class="chips">' + (S.contacts.map(c => `<button data-a="cont" data-id="${c.id}" class="${S.contact === c.id ? 'on' : ''}">${esc(c.name)}</button>`).join('') || '<span class="mute">Avval Kontakt bo\'limida kontakt qo\'shing.</span>') + '</div>' : ''}<div class="between" style="margin-bottom:8px"><span>Jami</span><span class="big">${money(total)}</span></div><button class="btn" data-a="sell">Sotish</button>`) : '<div class="empty">Savat bo\'sh.</div>');
    document.querySelectorAll('[data-q]').forEach(i => i.onchange = () => { const v = Math.floor(+i.value); if (v > 0) S.cart[i.dataset.q] = v; else delete S.cart[i.dataset.q]; fill(); });
  }
  if (t === 'tov') {

    const ks = g('ks'), kv = ks.value; ks.innerHTML = S.products.map(p => `<option value="${p.id}">${esc(p.name)} (${p.stock || 0})</option>`).join(''); ks.value = kv;

  if (t === 'esl') H('nl', S.notes.slice().sort((a, b) => (a.done - b.done) || String(a.date || '9').localeCompare(String(b.date || '9'))).map(n => row(`<div><b style="${n.done ? 'text-decoration:line-through;opacity:.5' : ''}">${esc(n.text)}</b>${n.date ? `<div class="mute">${esc(n.date)}</div>` : ''}</div>`, `<div class="row" style="flex:none"><button class="btn sm ${n.done ? 'ghost' : ''}" data-a="done" data-id="${n.id}" data-v="${n.done ? 1 : 0}">${n.done ? 'Qaytarish' : 'Bajarildi'}</button>${del('notes', n.id)}</div>`)).join('') || '<div class="empty">Eslatma yo\'q.</div>');
  if (t === 'stol') H('tl', S.tables.map(x => row(`<b>${esc(x.name)}</b>`, del('tables', x.id))).join('') || '<div class="empty">Stol yo\'q.</div>');
  if (t === 'xar') H('el', S.expenses.map(x => row(`<div><b>${esc(x.name)}</b></div>`, `<div class="between" style="gap:10px"><b>${money(x.amount)}</b>${del('expenses', x.id)}</div>`)).join('') || '<div class="empty">Bu kun xarajat yo\'q.</div>');
  if (t === 'xod') H('xl2', S.users.map(u => row(`<div><b>${esc(u.name)}</b><div class="mute">${esc(u.login)} · ${esc(u.role)}</div></div>`, u.id === S.me.id ? '' : del('users', u.id))).join(''));
  if (t === 'hisob') {
    const rev = S.sales.reduce((s, x) => s + x.total, 0), cogs = S.sales.reduce((s, x) => s + x.items.reduce((a, i) => a + i.cost * i.qty, 0), 0), exp = S.expenses.reduce((s, x) => s + x.amount, 0), wg = S.wages.reduce((s, x) => s + x.amount, 0), totalDebt = S.debtSales.reduce((s, x) => s + x.total, 0) - S.debtPays.reduce((s, x) => s + x.amount, 0), by = k => S.sales.filter(x => x.pay === k).reduce((s, x) => s + x.total, 0), pr = rev - cogs - exp - wg, top = {};
    S.sales.forEach(x => x.items.forEach(i => top[i.name] = (top[i.name] || 0) + i.qty));
    H('rb', `<div class="card"><div class="mute">Sof foyda</div><div class="big ${pr >= 0 ? 'pos' : 'neg'}">${money(pr)}</div></div><div class="card"><div class="between"><span>Tushum (${S.sales.length} ta)</span><b>${money(rev)}</b></div>${['naqd','karta','terminal','qarz'].map(k => `<div class="between mute"><span>${k[0].toUpperCase() + k.slice(1)}</span><span>${money(by(k))}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line);margin:10px 0"><div class="between"><span>Tannarx</span><b>${money(cogs)}</b></div><div class="between"><span>Xarajat</span><b>${money(exp)}</b></div><div class="between"><span>Oylik</span><b>${money(wg)}</b></div><div class="between"><span>Jami qarz (to'lanmagan)</span><b class="neg">${money(totalDebt)}</b></div></div><div class="card"><b>Ko'p sotilgan</b>${Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => `<div class="between"><span>${esc(x[0])}</span><b>${x[1]} ta</b></div>`).join('') || '<div class="mute">Savdo yo\'q.</div>'}</div><div class="card"><b>Qoldiq</b>${S.products.map(p => `<div class="between"><span>${esc(p.name)}</span><b class="${(p.stock || 0) <= 5 ? 'low' : ''}">${p.stock || 0}</b></div>`).join('') || '<div class="mute">Tovar yo\'q.</div>'}</div>`);
